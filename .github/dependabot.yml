version: 2

updates:
  - package-ecosystem: npm
    directory: "/"
    target-branch: main
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 10
    groups:
      react-runtime:
        patterns:
          - react
          - react-dom
    commit-message:
      prefix: deps
